<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    /* ── CONFIG SCREEN ── */
    #config-screen {
      position: fixed;
      inset: 0;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .config-box {
      width: 400px;
      padding: 36px;
      border: 1px solid #1a1a1a;
      background: #0e0e0e;
      border-radius: 4px;
    }

    .config-box h1 {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      color: #1DB954;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .config-box label {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: #444;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .config-box input {
      width: 100%;
      background: #080808;
      border: 1px solid #1e1e1e;
      color: #ccc;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 10px 12px;
      outline: none;
      margin-bottom: 18px;
      border-radius: 2px;
      transition: border-color 0.2s;
    }

    .config-box input:focus { border-color: #1DB954; }
    .config-box input[readonly] { color: #333; cursor: default; }

    .config-box button {
      width: 100%;
      background: #1DB954;
      border: none;
      color: #000;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 12px;
      cursor: pointer;
      border-radius: 2px;
      transition: opacity 0.2s;
    }

    .config-box button:hover { opacity: 0.8; }

    .config-hint {
      margin-top: 18px;
      font-size: 10px;
      color: #2a2a2a;
      line-height: 1.9;
      font-family: 'DM Mono', monospace;
    }

    .config-hint a { color: #333; text-decoration: underline; }
    .config-hint strong { color: #555; }

    /* ── AUTH SCREEN ── */
    #auth-screen {
      position: fixed;
      inset: 0;
      background: #080808;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .auth-box { text-align: center; }

    .auth-box .logo {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: #1DB954;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .auth-box button {
      background: transparent;
      border: 1px solid #1DB954;
      color: #1DB954;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 11px 28px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }

    .auth-box button:hover { background: #1DB954; color: #000; }

    .auth-box .reset {
      margin-top: 14px;
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: #252525;
      cursor: pointer;
      background: none;
      border: none;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .auth-box .reset:hover { color: #444; }

    /* ── WIDGET ── */
    #widget {
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(8, 8, 8, 0.95);
      border: 1px solid #151515;
      padding: 10px 14px 10px 10px;
      border-radius: 6px;
      width: 300px;
      animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
      position: relative;
      overflow: hidden;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Album art */
    .album-art {
      width: 48px;
      height: 48px;
      border-radius: 3px;
      background: #111;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .album-art .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    .album-art .placeholder svg {
      width: 20px;
      height: 20px;
      opacity: 0.15;
    }

    /* Track info */
    .track-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .track-title {
      font-size: 12px;
      font-weight: 500;
      color: #e8e8e8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .track-artist {
      font-size: 10px;
      font-weight: 300;
      color: #3a3a3a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.02em;
    }

    /* Progress */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }

    .progress-bar {
      flex: 1;
      height: 2px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #1DB954;
      border-radius: 2px;
      width: 0%;
      transition: width 1s linear;
    }

    #widget.paused .progress-fill {
      background: #252525;
      transition: none;
    }

    .progress-time {
      font-family: 'DM Mono', monospace;
      font-size: 8px;
      color: #252525;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      min-width: 30px;
      text-align: right;
    }

    /* Scroll title */
    .track-title.scroll {
      animation: scroll-title 9s linear infinite;
      white-space: nowrap;
      overflow: visible;
      text-overflow: unset;
    }

    @keyframes scroll-title {
      0%   { transform: translateX(0); }
      35%  { transform: translateX(var(--scroll-dist)); }
      65%  { transform: translateX(var(--scroll-dist)); }
      100% { transform: translateX(0); }
    }

    /* Nothing playing */
    #nothing-playing {
      display: none;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: #1a1a1a;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- CONFIG -->
  <div id="config-screen">
    <div class="config-box">
      <h1>⬡ Spotify Widget · OBS</h1>
      <label>Client ID Spotify</label>
      <input type="text" id="client-id-input" placeholder="Colle ton Client ID ici..." />
      <label>Redirect URI</label>
      <input type="text" id="redirect-uri-input" value="https://kahillegends.github.io/spotify-widget/" readonly />
      <button onclick="saveConfig()">Connecter Spotify →</button>
      <p class="config-hint">
        1. <a href="https://developer.spotify.com/dashboard" target="_blank">developer.spotify.com/dashboard</a><br/>
        2. Crée une app → copie le <strong>Client ID</strong><br/>
        3. Settings → Redirect URIs → ajoute l'URL ci-dessus<br/>
        4. Colle le Client ID et clique Connecter
      </p>
    </div>
  </div>

  <!-- AUTH -->
  <div id="auth-screen">
    <div class="auth-box">
      <p class="logo">⬡ Spotify Widget</p>
      <button onclick="startAuth()">Connecter Spotify</button>
      <button class="reset" onclick="resetConfig()">← Changer de Client ID</button>
    </div>
  </div>

  <!-- WIDGET -->
  <div id="widget">
    <div class="album-art" id="album-art">
      <div class="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
    </div>
    <div class="track-info">
      <div class="track-title" id="title">—</div>
      <div class="track-artist" id="artist">—</div>
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-time" id="progress-time">0:00</div>
      </div>
    </div>
  </div>

  <div id="nothing-playing">— rien en lecture —</div>

<script>
  const REDIRECT_URI = 'https://kahillegends.github.io/spotify-widget/';
  const SCOPES       = 'user-read-currently-playing user-read-playback-state';

  let CLIENT_ID    = localStorage.getItem('sp_client_id')    || '';
  let accessToken  = localStorage.getItem('sp_access_token') || null;
  let refreshToken = localStorage.getItem('sp_refresh_token')|| null;
  let pollInterval     = null;
  let progressInterval = null;

  let localProgress = 0;
  let localDuration = 0;
  let localPlaying  = false;

  window.addEventListener('load', async () => {
    const params = new URLSearchParams(window.location.search);
    const code   = params.get('code');

    if (code && CLIENT_ID) {
      window.history.replaceState({}, '', window.location.pathname);
      await exchangeCode(code);
      return;
    }

    if (accessToken) { showWidget(); startPolling(); }
    else if (CLIENT_ID) { show('auth-screen'); hide('config-screen'); }
    else { show('config-screen'); }
  });

  function saveConfig() {
    const id = document.getElementById('client-id-input').value.trim();
    if (!id) { alert('Entre ton Client ID Spotify.'); return; }
    CLIENT_ID = id;
    localStorage.setItem('sp_client_id', CLIENT_ID);
    hide('config-screen');
    show('auth-screen');
  }

  function resetConfig() { hide('auth-screen'); show('config-screen'); }

  async function generateCodeVerifier() {
    const arr = new Uint8Array(64);
    crypto.getRandomValues(arr);
    return btoa(String.fromCharCode(...arr)).replace(/[^A-Za-z0-9]/g, '').slice(0, 128);
  }

  async function generateCodeChallenge(verifier) {
    const data   = new TextEncoder().encode(verifier);
    const digest = await crypto.subtle.digest('SHA-256', data);
    return btoa(String.fromCharCode(...new Uint8Array(digest)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  }

  async function startAuth() {
    const verifier  = await generateCodeVerifier();
    const challenge = await generateCodeChallenge(verifier);
    localStorage.setItem('sp_code_verifier', verifier);

    const url = new URL('https://accounts.spotify.com/authorize');
    url.searchParams.set('client_id',            CLIENT_ID);
    url.searchParams.set('response_type',         'code');
    url.searchParams.set('redirect_uri',          REDIRECT_URI);
    url.searchParams.set('scope',                 SCOPES);
    url.searchParams.set('code_challenge_method', 'S256');
    url.searchParams.set('code_challenge',        challenge);
    window.location.href = url.toString();
  }

  async function exchangeCode(code) {
    const verifier = localStorage.getItem('sp_code_verifier');
    const body = new URLSearchParams({
      grant_type:    'authorization_code',
      code,
      redirect_uri:  REDIRECT_URI,
      client_id:     CLIENT_ID,
      code_verifier: verifier,
    });
    const res  = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    const data = await res.json();
    if (data.access_token) {
      accessToken  = data.access_token;
      refreshToken = data.refresh_token;
      localStorage.setItem('sp_access_token',  accessToken);
      localStorage.setItem('sp_refresh_token', refreshToken);
      showWidget();
      startPolling();
    } else {
      alert('Erreur auth : ' + JSON.stringify(data));
      show('auth-screen');
    }
  }

  async function refreshAccessToken() {
    if (!refreshToken) return false;
    const body = new URLSearchParams({
      grant_type:    'refresh_token',
      refresh_token: refreshToken,
      client_id:     CLIENT_ID,
    });
    const res  = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    const data = await res.json();
    if (data.access_token) {
      accessToken = data.access_token;
      localStorage.setItem('sp_access_token', accessToken);
      if (data.refresh_token) {
        refreshToken = data.refresh_token;
        localStorage.setItem('sp_refresh_token', refreshToken);
      }
      return true;
    }
    return false;
  }

  function startPolling() {
    fetchCurrentTrack();
    pollInterval = setInterval(fetchCurrentTrack, 5000);
    progressInterval = setInterval(() => {
      if (!localPlaying) return;
      localProgress = Math.min(localProgress + 1000, localDuration);
      renderProgress();
    }, 1000);
  }

  async function fetchCurrentTrack() {
    try {
      let res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { 'Authorization': 'Bearer ' + accessToken }
      });

      if (res.status === 401) {
        const ok = await refreshAccessToken();
        if (!ok) { logout(); return; }
        res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { 'Authorization': 'Bearer ' + accessToken }
        });
      }

      if (res.status === 204) { setNothingPlaying(); return; }

      const data = await res.json();
      if (!data || !data.item) { setNothingPlaying(); return; }

      localProgress = data.progress_ms       || 0;
      localDuration = data.item.duration_ms  || 1;
      localPlaying  = data.is_playing;

      const title  = data.item.name;
      const artist = data.item.artists.map(a => a.name).join(', ');
      const imgUrl = data.item.album?.images?.[1]?.url || data.item.album?.images?.[0]?.url || null;

      updateWidget(title, artist, imgUrl, data.is_playing);
    } catch (e) {
      console.error('Spotify fetch error', e);
    }
  }

  let lastTitle = '';

  function updateWidget(title, artist, imgUrl, isPlaying) {
    const widget   = document.getElementById('widget');
    const titleEl  = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const artEl    = document.getElementById('album-art');

    if (title !== lastTitle) {
      titleEl.classList.remove('scroll');
      titleEl.textContent  = title;
      artistEl.textContent = artist;
      lastTitle = title;

      artEl.innerHTML = imgUrl
        ? `<img src="${imgUrl}" alt="cover" />`
        : `<div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg></div>`;

      requestAnimationFrame(() => {
        const overflow = titleEl.scrollWidth - titleEl.clientWidth;
        if (overflow > 8) {
          titleEl.style.setProperty('--scroll-dist', `-${overflow + 12}px`);
          titleEl.classList.add('scroll');
        }
      });
    }

    widget.className = isPlaying ? 'playing' : 'paused';
    widget.id = 'widget';
    renderProgress();
    show('widget');
    document.getElementById('nothing-playing').style.display = 'none';
  }

  function renderProgress() {
    const fill = document.getElementById('progress-fill');
    const time = document.getElementById('progress-time');
    const pct  = localDuration > 0 ? (localProgress / localDuration) * 100 : 0;
    fill.style.width = pct.toFixed(2) + '%';
    const rem = Math.max(0, localDuration - localProgress);
    const m   = Math.floor(rem / 60000);
    const s   = Math.floor((rem % 60000) / 1000);
    time.textContent = `-${m}:${s.toString().padStart(2, '0')}`;
  }

  function setNothingPlaying() {
    localPlaying = false;
    hide('widget');
    document.getElementById('nothing-playing').style.display = 'block';
  }

  function showWidget() { hide('config-screen'); hide('auth-screen'); }

  function logout() {
    clearInterval(pollInterval);
    clearInterval(progressInterval);
    localStorage.removeItem('sp_access_token');
    localStorage.removeItem('sp_refresh_token');
    accessToken = refreshToken = null;
    hide('widget');
    show('auth-screen');
  }

  function show(id) { document.getElementById(id).style.display = 'flex'; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
