<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: 'Geist', sans-serif;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── CONFIG SCREEN ── */
    #config-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .config-box {
      width: 420px;
      padding: 40px;
      border: 1px solid #222;
      background: #111;
    }

    .config-box h1 {
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      font-weight: 400;
      color: #1DB954;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .config-box label {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #555;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .config-box input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #222;
      color: #eee;
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      padding: 10px 12px;
      outline: none;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    .config-box input:focus { border-color: #1DB954; }

    .config-box input[readonly] {
      color: #444;
      cursor: default;
    }

    .config-box button {
      width: 100%;
      background: #1DB954;
      border: none;
      color: #000;
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .config-box button:hover { opacity: 0.85; }

    .config-hint {
      margin-top: 20px;
      font-size: 11px;
      color: #333;
      line-height: 1.8;
      font-family: 'Geist Mono', monospace;
    }

    .config-hint a { color: #555; text-decoration: underline; }
    .config-hint strong { color: #eee; }

    /* ── AUTH SCREEN ── */
    #auth-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .auth-box { text-align: center; }

    .auth-box .logo {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      color: #1DB954;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .auth-box button {
      background: transparent;
      border: 1px solid #1DB954;
      color: #1DB954;
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 12px 32px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-box button:hover { background: #1DB954; color: #000; }

    .auth-box .reset {
      margin-top: 16px;
      display: block;
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      color: #333;
      cursor: pointer;
      background: none;
      border: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .auth-box .reset:hover { color: #555; }

    /* ── WIDGET ── */
    #widget {
      display: none;
      align-items: center;
      gap: 14px;
      background: rgba(10, 10, 10, 0.92);
      border: 1px solid #1a1a1a;
      padding: 14px 18px;
      backdrop-filter: blur(8px);
      max-width: 360px;
      animation: fadeIn 0.6s ease forwards;
      position: relative;
      overflow: hidden;
    }

    #widget::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: #1DB954;
      opacity: 0;
      transition: opacity 0.4s;
    }

    #widget.playing::before { opacity: 1; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .track-info { flex: 1; min-width: 0; }

    .track-title {
      font-size: 13px;
      font-weight: 500;
      color: #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .track-artist {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      color: #444;
      letter-spacing: 0.08em;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #1DB954;
      flex-shrink: 0;
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .status-dot.paused { background: #333; animation: none; }

    .track-title.scroll {
      animation: scroll-text 8s linear infinite;
      white-space: nowrap;
      overflow: visible;
      text-overflow: unset;
    }

    @keyframes scroll-text {
      0%   { transform: translateX(0); }
      40%  { transform: translateX(var(--scroll-dist)); }
      60%  { transform: translateX(var(--scroll-dist)); }
      100% { transform: translateX(0); }
    }

    #nothing-playing {
      display: none;
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      color: #222;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- STEP 1 : Config -->
  <div id="config-screen">
    <div class="config-box">
      <h1>⬡ Spotify Widget · OBS</h1>
      <label>Client ID Spotify</label>
      <input type="text" id="client-id-input" placeholder="Colle ton Client ID ici..." />
      <label>Redirect URI (ne pas modifier)</label>
      <input type="text" id="redirect-uri-input" value="https://kahillegends.github.io/spotify-widget/" readonly />
      <button onclick="saveConfig()">Connecter Spotify →</button>
      <p class="config-hint">
        1. Va sur <a href="https://developer.spotify.com/dashboard" target="_blank">developer.spotify.com/dashboard</a><br/>
        2. Crée une app → copie le <strong>Client ID</strong><br/>
        3. Dans Settings → Redirect URIs, ajoute :<br/>
        <strong>https://kahillegends.github.io/spotify-widget/</strong><br/>
        4. Colle le Client ID ci-dessus et clique Connecter
      </p>
    </div>
  </div>

  <!-- STEP 2 : Auth -->
  <div id="auth-screen">
    <div class="auth-box">
      <p class="logo">⬡ Spotify Widget</p>
      <button onclick="startAuth()">Connecter Spotify</button>
      <button class="reset" onclick="resetConfig()">← Changer de Client ID</button>
    </div>
  </div>

  <!-- STEP 3 : Widget -->
  <div id="widget">
    <div class="status-dot" id="dot"></div>
    <div class="track-info">
      <div class="track-title" id="title">—</div>
      <div class="track-artist" id="artist">—</div>
    </div>
  </div>

  <div id="nothing-playing">— rien en lecture —</div>

<script>
  const REDIRECT_URI = 'https://kahillegends.github.io/spotify-widget/';
  const SCOPES       = 'user-read-currently-playing user-read-playback-state';

  let CLIENT_ID    = localStorage.getItem('sp_client_id')    || '';
  let accessToken  = localStorage.getItem('sp_access_token') || null;
  let refreshToken = localStorage.getItem('sp_refresh_token')|| null;
  let pollInterval = null;

  // ── INIT ──
  window.addEventListener('load', async () => {
    const params = new URLSearchParams(window.location.search);
    const code   = params.get('code');

    if (code && CLIENT_ID) {
      window.history.replaceState({}, '', window.location.pathname);
      await exchangeCode(code);
      return;
    }

    if (accessToken) {
      showWidget();
      startPolling();
    } else if (CLIENT_ID) {
      show('auth-screen');
      hide('config-screen');
    } else {
      show('config-screen');
    }
  });

  // ── CONFIG ──
  function saveConfig() {
    const id = document.getElementById('client-id-input').value.trim();
    if (!id) { alert('Entre ton Client ID Spotify.'); return; }
    CLIENT_ID = id;
    localStorage.setItem('sp_client_id', CLIENT_ID);
    hide('config-screen');
    show('auth-screen');
  }

  function resetConfig() {
    hide('auth-screen');
    show('config-screen');
  }

  // ── PKCE ──
  async function generateCodeVerifier() {
    const arr = new Uint8Array(64);
    crypto.getRandomValues(arr);
    return btoa(String.fromCharCode(...arr)).replace(/[^A-Za-z0-9]/g, '').slice(0, 128);
  }

  async function generateCodeChallenge(verifier) {
    const data   = new TextEncoder().encode(verifier);
    const digest = await crypto.subtle.digest('SHA-256', data);
    return btoa(String.fromCharCode(...new Uint8Array(digest)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  }

  // ── AUTH ──
  async function startAuth() {
    const verifier  = await generateCodeVerifier();
    const challenge = await generateCodeChallenge(verifier);
    localStorage.setItem('sp_code_verifier', verifier);

    const url = new URL('https://accounts.spotify.com/authorize');
    url.searchParams.set('client_id',            CLIENT_ID);
    url.searchParams.set('response_type',         'code');
    url.searchParams.set('redirect_uri',          REDIRECT_URI);
    url.searchParams.set('scope',                 SCOPES);
    url.searchParams.set('code_challenge_method', 'S256');
    url.searchParams.set('code_challenge',        challenge);

    window.location.href = url.toString();
  }

  async function exchangeCode(code) {
    const verifier = localStorage.getItem('sp_code_verifier');
    const body = new URLSearchParams({
      grant_type:    'authorization_code',
      code,
      redirect_uri:  REDIRECT_URI,
      client_id:     CLIENT_ID,
      code_verifier: verifier,
    });

    const res  = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    const data = await res.json();

    if (data.access_token) {
      accessToken  = data.access_token;
      refreshToken = data.refresh_token;
      localStorage.setItem('sp_access_token',  accessToken);
      localStorage.setItem('sp_refresh_token', refreshToken);
      showWidget();
      startPolling();
    } else {
      alert('Erreur auth Spotify : ' + JSON.stringify(data));
      show('auth-screen');
    }
  }

  async function refreshAccessToken() {
    if (!refreshToken) return false;
    const body = new URLSearchParams({
      grant_type:    'refresh_token',
      refresh_token: refreshToken,
      client_id:     CLIENT_ID,
    });
    const res  = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    const data = await res.json();
    if (data.access_token) {
      accessToken = data.access_token;
      localStorage.setItem('sp_access_token', accessToken);
      if (data.refresh_token) {
        refreshToken = data.refresh_token;
        localStorage.setItem('sp_refresh_token', refreshToken);
      }
      return true;
    }
    return false;
  }

  // ── POLLING ──
  function startPolling() {
    fetchCurrentTrack();
    pollInterval = setInterval(fetchCurrentTrack, 5000);
  }

  async function fetchCurrentTrack() {
    try {
      let res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { 'Authorization': 'Bearer ' + accessToken }
      });

      if (res.status === 401) {
        const ok = await refreshAccessToken();
        if (!ok) { logout(); return; }
        res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { 'Authorization': 'Bearer ' + accessToken }
        });
      }

      if (res.status === 204) { setNothingPlaying(); return; }

      const data = await res.json();
      if (!data || !data.item) { setNothingPlaying(); return; }

      updateWidget(data.item.name, data.item.artists.map(a => a.name).join(', '), data.is_playing);

    } catch (e) {
      console.error('Spotify fetch error', e);
    }
  }

  // ── UI ──
  function updateWidget(title, artist, isPlaying) {
    const widget   = document.getElementById('widget');
    const titleEl  = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const dot      = document.getElementById('dot');

    titleEl.textContent  = title;
    artistEl.textContent = artist.toUpperCase();
    dot.className        = 'status-dot' + (isPlaying ? '' : ' paused');

    if (isPlaying) widget.classList.add('playing');
    else widget.classList.remove('playing');

    titleEl.classList.remove('scroll');
    requestAnimationFrame(() => {
      const overflow = titleEl.scrollWidth - titleEl.clientWidth;
      if (overflow > 10) {
        titleEl.style.setProperty('--scroll-dist', `-${overflow + 16}px`);
        titleEl.classList.add('scroll');
      }
    });

    show('widget');
    document.getElementById('nothing-playing').style.display = 'none';
  }

  function setNothingPlaying() {
    hide('widget');
    document.getElementById('nothing-playing').style.display = 'block';
  }

  function showWidget() {
    hide('config-screen');
    hide('auth-screen');
  }

  function logout() {
    clearInterval(pollInterval);
    localStorage.removeItem('sp_access_token');
    localStorage.removeItem('sp_refresh_token');
    accessToken = refreshToken = null;
    hide('widget');
    show('auth-screen');
  }

  function show(id) { document.getElementById(id).style.display = 'flex'; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
